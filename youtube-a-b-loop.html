<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube A-B Loop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      background: #111;
      color: #eee;
    }

    h1 {
      margin-bottom: 24px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    input {
      padding: 10px 12px;
      font-size: 16px;
      background: #1c1c1c;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: #888;
    }

    input::placeholder {
      color: #888;
    }

    #video {
      flex: 1;
      min-width: 300px;
    }

    #start,
    #end {
      width: 100px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      background: #eee;
      color: #111;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #ccc;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    #status {
      min-height: 24px;
      margin-bottom: 20px;
      color: #aaa;
    }

    #player {
      max-width: 100%;
    }

    iframe {
      max-width: 100%;
      border-radius: 8px;
    }
  </style>

</head>

<body>

<h1>YouTube A-B Loop</h1>

<div class="controls">
  <input id="video" placeholder="YouTube URL or video ID">
  <input id="start" placeholder="Start" value="0">
  <input id="end" placeholder="End">

  <button id="loadButton" disabled>
    Loading YouTube...
  </button>
</div>

<div id="status">Loading YouTube API...</div>

<div id="player"></div>

<script>
  let player = null;
  let loopTimer = null;
  let youtubeReady = false;
  let startTime = 0;
  let endTime = null;

  const button = document.getElementById("loadButton");
  const status = document.getElementById("status");

  function markYouTubeReady() {
    if (youtubeReady) {
      return;
    }

    if (!window.YT || !window.YT.Player) {
      return;
    }

    youtubeReady = true;
    button.disabled = false;
    button.textContent = "Load";
    status.textContent = "YouTube API loaded.";
  }

  window.onYouTubeIframeAPIReady = function () {
    markYouTubeReady();
  };

  function parseTime(value) {
    value = value.trim();

    if (!value) {
      return null;
    }

    if (!value.includes(":")) {
      return Number(value);
    }

    const parts = value.split(":").map(Number);
    let seconds = 0;

    for (const part of parts) {
      seconds = seconds * 60 + part;
    }

    return seconds;
  }

  function extractVideoId(input) {
    input = input.trim();

    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
      return input;
    }

    try {
      const url = new URL(input);
      const hostname = url.hostname.replace(/^www\./, "");

      if (
        hostname === "youtube.com" ||
        hostname === "m.youtube.com"
      ) {
        const id = url.searchParams.get("v");

        if (id) {
          return id;
        }

        const parts = url.pathname.split("/").filter(Boolean);

        if (
          (parts[0] === "embed" || parts[0] === "shorts") &&
          parts[1]
        ) {
          return parts[1];
        }
      }

      if (hostname === "youtu.be") {
        return url.pathname.split("/").filter(Boolean)[0];
      }
    } catch (_) {}

    return null;
  }

  function loadVideo() {
    const videoId = extractVideoId(
      document.getElementById("video").value
    );

    if (!videoId) {
      status.textContent = "Could not recognize the video ID.";
      return;
    }

    startTime =
      parseTime(document.getElementById("start").value) ?? 0;

    endTime =
      parseTime(document.getElementById("end").value);

    if (Number.isNaN(startTime)) {
      status.textContent = "Invalid start time.";
      return;
    }

    if (endTime !== null && Number.isNaN(endTime)) {
      status.textContent = "Invalid end time.";
      return;
    }

    if (endTime !== null && endTime <= startTime) {
      status.textContent = "End must be greater than start.";
      return;
    }

    clearInterval(loopTimer);

    status.textContent = "Loading video...";

    if (player) {
      player.loadVideoById({
        videoId,
        startSeconds: startTime
      });

      return;
    }

    player = new YT.Player("player", {
      width: 960,
      height: 540,
      videoId,

      playerVars: {
        controls: 1,
        playsinline: 1,
        origin: window.location.origin
      },

      events: {
        onReady: event => {
          status.textContent = "";
          event.target.seekTo(startTime, true);
          event.target.playVideo();
        },

        onStateChange: onPlayerStateChange,

        onError: event => {
          status.textContent =
            "YouTube player error: " + event.data;
        }
      }
    });
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      status.textContent = "";

      clearInterval(loopTimer);

      loopTimer = setInterval(() => {
        if (
          endTime !== null &&
          player.getCurrentTime() >= endTime
        ) {
          player.seekTo(startTime, true);
        }
      }, 100);
    }

    if (
      event.data === YT.PlayerState.PAUSED ||
      event.data === YT.PlayerState.ENDED
    ) {
      clearInterval(loopTimer);
    }
  }

  button.addEventListener("click", loadVideo);

  document.querySelectorAll("input").forEach(input => {
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && youtubeReady) {
        loadVideo();
      }
    });
  });

  const script = document.createElement("script");

  script.src = "https://www.youtube.com/iframe_api";

  script.onerror = function () {
    status.textContent =
      "Failed to load YouTube API. Check browser blocking, DNS or network settings.";

    button.textContent = "YouTube unavailable";
  };

  document.head.appendChild(script);

  const apiCheck = setInterval(() => {
    if (window.YT && window.YT.Player) {
      clearInterval(apiCheck);
      markYouTubeReady();
    }
  }, 100);
</script>

</body>
</html>
